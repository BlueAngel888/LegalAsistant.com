<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OCR Service - Upload Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem 0;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 1rem;
        }
        
        .header {
            background: white;
            padding: 2rem;
            border-radius: 20px 20px 0 0;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        
        .header h1 {
            color: #333;
            margin-bottom: 0.5rem;
        }
        
        .payment-success {
            color: #28a745;
            font-weight: 600;
            margin-bottom: 1rem;
        }
        
        .upload-section {
            background: white;
            padding: 2rem;
            border-radius: 0 0 20px 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        
        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 3rem;
            text-align: center;
            background: #f8f9ff;
            margin-bottom: 2rem;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f2ff;
        }
        
        .upload-area.dragover {
            border-color: #28a745;
            background: #f0fff4;
        }
        
        .upload-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        
        .upload-text {
            color: #666;
            margin-bottom: 1rem;
        }
        
        .file-input {
            display: none;
        }
        
        .upload-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }
        
        .processing {
            display: none;
            text-align: center;
            padding: 2rem;
            color: #667eea;
        }
        
        .processing-spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .results {
            display: none;
            margin-top: 2rem;
            padding: 2rem;
            background: #f8f9fa;
            border-radius: 15px;
        }
        
        .results h3 {
            color: #333;
            margin-bottom: 1rem;
            border-bottom: 2px solid #667eea;
            padding-bottom: 0.5rem;
        }
        
        .extracted-text {
            background: white;
            padding: 1.5rem;
            border-radius: 10px;
            border-left: 4px solid #667eea;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
            line-height: 1.6;
        }
        
        .file-info {
            margin-bottom: 1rem;
            color: #666;
            font-size: 0.9rem;
        }
        
        .error {
            display: none;
            background: #f8d7da;
            color: #721c24;
            padding: 1rem;
            border-radius: 10px;
            margin-top: 1rem;
        }
        
        .new-upload-btn {
            margin-top: 1rem;
            background: #28a745;
        }
        
        .new-upload-btn:hover {
            background: #218838;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📄 Document OCR Processing</h1>
            <div class="payment-success">✅ Payment Successful - Ready to Process</div>
            <p>Payment ID: {{ payment_id }}</p>
        </div>
        
        <div class="upload-section">
            <div class="upload-area" id="upload-area">
                <div class="upload-icon">📤</div>
                <div class="upload-text">
                    <strong>Drop your image here or click to browse</strong><br>
                    Supports: JPG, PNG, GIF, BMP • Max size: 10MB
                </div>
                <button type="button" class="upload-btn" id="browse-btn">
                    Choose Image
                </button>
                <input type="file" id="file-input" class="file-input" accept="image/*">
            </div>
            
            <div class="processing" id="processing">
                <div class="processing-spinner"></div>
                <div>Processing your image with OCR...</div>
                <div style="font-size: 0.9rem; color: #888; margin-top: 0.5rem;">
                    This may take a few seconds depending on image size
                </div>
            </div>
            
            <div class="results" id="results">
                <h3>📝 Extracted Text</h3>
                <div class="file-info" id="file-info"></div>
                <div class="extracted-text" id="extracted-text"></div>
                <button type="button" class="upload-btn new-upload-btn" id="new-upload-btn">
                    Process Another Image
                </button>
            </div>
            
            <div class="error" id="error"></div>
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='script_new.js') }}"></script>
</body>
</html>
